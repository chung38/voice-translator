<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>即時翻譯系統 Pro 商用版</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">

<style>
:root{
 --bg:#0d0d0d;
 --surface:#181818;
 --border:#2a2a2a;
 --a:#4db6ff;
 --b:#ff7043;
 --text:#eee;
 --dim:#777;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Noto Sans TC}
body{background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;max-width:720px;margin:auto}
.top{padding:10px;background:var(--surface);display:flex;gap:6px}
.tab{padding:6px 12px;border:1px solid var(--border);border-radius:18px;font-size:12px;color:var(--dim);cursor:pointer}
.tab.active{border-color:var(--a);color:var(--a)}
.chat{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px;border-radius:12px}
.a{align-self:flex-start;background:rgba(77,182,255,.12)}
.b{align-self:flex-end;background:rgba(255,112,67,.12)}
.bottom{padding:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px}
.btn{width:72px;height:72px;border-radius:50%;border:2px solid #3a3;background:#1a2a1a}
.btn.live{border-color:#f55;background:rgba(255,80,80,.15)}
.status{font-size:12px;color:var(--dim)}
.small{font-size:11px;color:#666}
</style>
</head>
<body>
<div class="app">

<div class="top">
<button class="tab active" onclick="setLang('vi',this)">越南</button>
<button class="tab" onclick="setLang('id',this)">印尼</button>
<button class="tab" onclick="setLang('th',this)">泰語</button>
<button class="tab" onclick="setLang('en',this)">英文</button>
</div>

<div class="chat" id="chat"></div>

<div class="bottom">
<div class="status" id="status">商用系統待機</div>
<button class="btn" id="btn" onclick="toggle()"></button>
<div class="small" id="net">ONLINE</div>
</div>

</div>

<script>
/* =====================
 商用架構核心
===================== */

const CONFIG={
 apiPrimary:'/api/translate',
 apiBackup:'/.netlify/functions/translate',
 ws:'wss://your-server.com/ws',
 offlineMode:true
};

const LANGS={
 vi:{sr:'vi-VN'},
 id:{sr:'id-ID'},
 th:{sr:'th-TH'},
 en:{sr:'en-US'}
};

let lang='vi';
let live=false;
let rec=null;
let ws=null;
let memory=[];
const MAX_MEMORY=8;

/* =====================
 PWA Service Worker
===================== */
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* =====================
 WebSocket (可升級多人會議)
===================== */
function connectWS(){
 try{
  ws=new WebSocket(CONFIG.ws);
  ws.onopen=()=>console.log('WS connected');
  ws.onmessage=e=>console.log('WS:',e.data);
 }catch(e){console.log('WS fail');}
}

/* =====================
 語言設定
===================== */
function setLang(l,el){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 el.classList.add('active');
 lang=l;
}

/* =====================
 啟動
===================== */
function toggle(){live?stop():start();}

function start(){
 live=true;
 document.getElementById('btn').classList.add('live');
 document.getElementById('status').textContent='運行中 (商用模式)';
 connectWS();
 loop();
}

function stop(){
 live=false;
 if(rec)rec.abort();
 if(ws)ws.close();
 document.getElementById('btn').classList.remove('live');
 document.getElementById('status').textContent='已停止';
}

/* =====================
 語音識別（自動說話者）
===================== */
function detectSpeaker(text){
 let zh=0,en=0;
 for(const c of text){
  const cp=c.codePointAt(0);
  if(cp>0x4E00&&cp<0x9FFF)zh++;
  else en++;
 }
 return zh>en?'zh':'foreign';
}

function loop(){
 if(!live)return;
 if(rec)rec.abort();

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 rec=new SR();
 rec.lang='zh-TW';
 rec.continuous=true;
 rec.interimResults=true;

 rec.onresult=async e=>{
  for(let i=e.resultIndex;i<e.results.length;i++){
   const t=e.results[i][0].transcript.trim();
   if(!t)continue;
   if(e.results[i].isFinal)await process(t);
  }
 };

 rec.onend=()=>{if(live)loop();};
 rec.start();
}

/* =====================
 AI 翻譯（含記憶）
===================== */
async function process(text){
 const side=detectSpeaker(text);
 const isZh=side==='zh';

 memory.push({text});
 if(memory.length>MAX_MEMORY)memory.shift();

 const prompt=isZh?
 buildPrompt('toForeign'):
 buildPrompt('toZh');

 const result=await translate(text,prompt);

 add(text,result,isZh);
 speak(result,isZh?LANGS[lang].sr:'zh-TW');
}

function buildPrompt(type){
 const history=memory.map(m=>m.text).join('\n');
 if(type==='toForeign'){
  return `根據對話上下文翻譯成${lang}，保持自然語氣:\n${history}`;
 }
 return `翻譯成繁體中文:\n${history}`;
}

/* =====================
 UI
===================== */
function add(o,t,zh){
 const d=document.createElement('div');
 d.className='msg '+(zh?'a':'b');
 d.innerHTML=`<div>${o}</div><div>${t}</div>`;
 document.getElementById('chat').appendChild(d);
}

function speak(text,lang){
 const u=new SpeechSynthesisUtterance(text);
 u.lang=lang;
 speechSynthesis.speak(u);
}

/* =====================
 翻譯 API (雙備援)
===================== */
async function translate(text,prompt){
 const payload={messages:[
  {role:'system',content:'專業即時翻譯，只輸出結果'},
  {role:'user',content:prompt+'\n'+text}
 ]};

 for(const url of [CONFIG.apiPrimary,CONFIG.apiBackup]){
  try{
   const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const j=await r.json();
   return j.choices[0].message.content;
  }catch(e){console.log('fail',url)}
 }

 return offline(text);
}

/* =====================
 離線模式
===================== */
function offline(t){
 document.getElementById('net').textContent='OFFLINE';
 return '[離線翻譯] '+t;
}
</script>

</body>
</html>

<!-- 商用版特性：
1. WebSocket 多人擴展架構
2. AI 記憶翻譯（上下文）
3. 雙 API failover
4. PWA 可安裝 App
5. 自動說話者辨識
6. 離線 fallback
-->
