<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>即時對話翻譯</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap');
:root{--bg:#0d0d0d;--surface:#181818;--border:#2e2e2e;--a-color:#4db6ff;--a-bg:rgba(77,182,255,0.12);--b-color:#ff7043;--b-bg:rgba(255,112,67,0.12);--text:#efefef;--text-dim:#555;--text-mid:#888}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Noto Sans',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:600px;margin:0 auto}
.top-bar{display:flex;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);gap:10px;flex-shrink:0}
.lang-tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--text-mid);transition:all .2s;white-space:nowrap}
.lang-tab.active{border-color:var(--a-color);color:var(--a-color);background:var(--a-bg)}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-hint{text-align:center;color:var(--text-dim);font-size:13px;padding:40px 20px;line-height:2}
.msg{display:flex;flex-direction:column;max-width:88%;animation:pop-in .18s ease}
@keyframes pop-in{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.msg.a{align-self:flex-start}.msg.b{align-self:flex-end;align-items:flex-end}
.msg-who{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;padding:0 4px}
.msg.a .msg-who{color:var(--a-color)}.msg.b .msg-who{color:var(--b-color)}
.msg-bubble{border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.msg.a .msg-bubble{background:rgba(77,182,255,0.13);border-top-left-radius:4px}
.msg.b .msg-bubble{background:rgba(255,112,67,0.13);border-top-right-radius:4px;text-align:right}
.msg-orig{font-size:15px;line-height:1.55;color:#fff;font-weight:500}
.msg-div{height:1px;background:rgba(255,255,255,.08);margin:1px 0}
.msg-tl{font-size:13px;line-height:1.5;color:rgba(255,255,255,.55);font-style:italic}
.msg-tling{font-size:12px;color:rgba(255,255,255,.3);display:flex;align-items:center;gap:5px}
.msg.b .msg-tling{flex-direction:row-reverse}
.dots{display:inline-flex;gap:3px}
.dots span{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);animation:db 1s infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes db{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.live-bubble{max-width:88%;padding:8px 14px;border-radius:14px;border:1px dashed var(--border);font-size:14px;color:rgba(255,255,255,.4);font-style:italic;display:flex;align-items:center;gap:8px;animation:pop-in .15s ease}
.live-bubble.b{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.micwave{display:flex;gap:2px;align-items:center;flex-shrink:0}
.micwave span{width:2px;border-radius:1px;animation:mw .65s ease-in-out infinite}
.live-bubble.a .micwave span{background:var(--a-color)}
.live-bubble.b .micwave span{background:var(--b-color)}
.micwave span:nth-child(1){height:5px}.micwave span:nth-child(2){height:12px;animation-delay:.1s}.micwave span:nth-child(3){height:7px;animation-delay:.2s}
@keyframes mw{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.msg-tl.speaking{position:relative}
.msg.a .msg-tl.speaking{padding-left:12px}.msg.b .msg-tl.speaking{padding-right:12px}
.msg-tl.speaking::before{content:'';position:absolute;top:50%;width:6px;height:6px;border-radius:50%;transform:translateY(-50%);animation:tts-dot .9s ease-in-out infinite}
.msg.a .msg-tl.speaking::before{left:0;background:var(--a-color)}.msg.b .msg-tl.speaking::before{right:0;background:var(--b-color)}
@keyframes tts-dot{0%,100%{opacity:.3;transform:translateY(-50%) scale(.7)}50%{opacity:1;transform:translateY(-50%) scale(1)}}
.sub-bar{background:#000;border-top:1px solid var(--border);padding:10px 18px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;flex-shrink:0}
.sub-orig{font-size:16px;font-weight:500;color:#fff;line-height:1.45;min-height:1.45em}
.sub-tl{font-size:14px;line-height:1.45;min-height:1.45em;transition:color .3s}
.sub-dim{color:var(--text-dim);font-size:13px;font-style:italic}
.bottom-bar{background:var(--surface);border-top:1px solid var(--border);padding:14px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0}
.status-label{font-size:13px;color:var(--text-mid);letter-spacing:.03em;height:18px;transition:color .3s}
.big-btn{width:76px;height:76px;border-radius:50%;border:2px solid #3a3;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#1c2a1c;transition:all .2s;outline:none}
.big-btn:active{transform:scale(.95)}
.big-btn.live{background:rgba(255,80,80,.12);border-color:#f55;animation:pulse-live 1.8s ease-in-out infinite}
@keyframes pulse-live{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.4)}50%{box-shadow:0 0 0 14px rgba(255,80,80,0)}}
.big-btn svg{width:32px;height:32px}
.switch-row{display:none;gap:10px;width:100%}
.sw-btn{flex:1;padding:14px 10px;border-radius:14px;border:2px solid var(--border);background:transparent;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text-mid);line-height:1.3;text-align:center}
.sw-btn:active{transform:scale(.97)}
.sw-btn.active-a{background:var(--a-color);color:#000;border-color:var(--a-color)}
.sw-btn.active-b{background:var(--b-color);color:#000;border-color:var(--b-color)}
.sw-btn.is-a{border-color:var(--a-color);color:var(--a-color)}
.sw-btn.is-b{border-color:var(--b-color);color:var(--b-color)}
.sw-btn.active-a.is-a,.sw-btn.active-b.is-b{color:#000}

/* 語速調整列 */
.rate-row{width:100%;display:flex;flex-direction:column;gap:6px}
.rate-header{display:flex;justify-content:space-between;align-items:center}
.rate-label{font-size:12px;color:var(--text-mid)}
.rate-value{font-size:12px;color:var(--text);font-weight:600;min-width:32px;text-align:right}
.rate-slider-wrap{display:flex;align-items:center;gap:8px}
.rate-slider-wrap span{font-size:11px;color:var(--text-dim);white-space:nowrap}
input[type=range].rate-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
input[type=range].rate-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--a-color);cursor:pointer;border:none}
input[type=range].rate-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--a-color);cursor:pointer;border:none}

.bottom-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.small-btn{flex:1;min-width:120px;background:none;border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--text-mid);cursor:pointer;transition:all .2s;text-align:center}
.small-btn:hover{border-color:#555;color:var(--text-mid)}
.small-btn.muted{border-color:#f55;color:#f55}
.warn-bar{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.25);border-radius:8px;padding:8px 14px;font-size:12px;color:#ff9090;text-align:center;display:none;margin:0 12px;flex-shrink:0}
.speaker-pill{display:flex;align-items:center;gap:8px;font-size:12px;height:20px}
.pill{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:500;letter-spacing:.04em;opacity:0;transition:opacity .3s}
.pill.a{background:var(--a-bg);color:var(--a-color);border:1px solid var(--a-color)}
.pill.b{background:var(--b-bg);color:var(--b-color);border:1px solid var(--b-color)}
.pill.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="vi" onclick="setLang(this)">🇻🇳 越南語</button>
      <button class="lang-tab" data-lang="th" onclick="setLang(this)">🇹🇭 泰語</button>
      <button class="lang-tab" data-lang="id" onclick="setLang(this)">🇮🇩 印尼語</button>
      <button class="lang-tab" data-lang="en" onclick="setLang(this)">🇬🇧 英語</button>
    </div>
  </div>
  <div class="chat" id="chat">
    <div class="chat-hint">按下開始按鈕<br>選擇說話者後開始說話<br>說完後再切換說話者</div>
  </div>
  <div class="warn-bar" id="warnBar"></div>
  <div class="sub-bar">
    <div class="sub-orig" id="subOrig"><span class="sub-dim">字幕顯示於此</span></div>
    <div class="sub-tl" id="subTl"></div>
  </div>
  <div class="bottom-bar">
    <div class="speaker-pill">
      <div class="pill a" id="pillA">說話者 A 中文</div>
      <div class="pill b" id="pillB">說話者 B</div>
    </div>
    <div class="status-label" id="statusLabel">按下開始對話</div>
    <button class="big-btn" id="bigBtn" onclick="toggleSession()">
      <svg id="iconMic" viewBox="0 0 32 32" fill="none">
        <rect x="11" y="3" width="10" height="16" rx="5" fill="#4a4"/>
        <path d="M6 16c0 5.523 4.477 10 10 10s10-4.477 10-10" stroke="#4a4" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="16" y1="26" x2="16" y2="30" stroke="#4a4" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <svg id="iconStop" viewBox="0 0 32 32" fill="none" style="display:none">
        <rect x="9" y="9" width="14" height="14" rx="3" fill="#f55"/>
      </svg>
    </button>
    <div class="switch-row" id="switchRow">
      <button class="sw-btn is-a" id="swBtnA" onclick="setSpeaker('a')">🇹🇼 A 說中文</button>
      <button class="sw-btn is-b" id="swBtnB" onclick="setSpeaker('b')"><span id="swBtnBLabel">🌐 B 說外語</span></button>
    </div>

    <!-- 語速調整 -->
    <div class="rate-row">
      <div class="rate-header">
        <span class="rate-label" id="rateLabel">🔊 朗讀語速</span>
        <span class="rate-value" id="rateDisplay">1.0×</span>
      </div>
      <div class="rate-slider-wrap">
        <span>慢</span>
        <input type="range" class="rate-slider" id="rateSlider"
               min="0.5" max="1.8" step="0.05" value="1.0"
               oninput="onRateChange(this.value)">
        <span>快</span>
      </div>
    </div>

    <div class="bottom-actions">
      <button class="small-btn" id="muteBtn" onclick="toggleMute()">🔊 翻譯朗讀</button>
      <button class="small-btn" onclick="clearChat()">🗑 清除記錄</button>
    </div>
  </div>
</div>
<script>
var LANGS = {
  vi:{label:'越南語',srCode:'vi-VN',ttsLang:'vi-VN',
      toTarget:'將以下繁體中文翻譯成越南語，只輸出翻譯結果，不加任何說明。',
      toZh:'將以下越南語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。'},
  th:{label:'泰語',srCode:'th-TH',ttsLang:'th-TH',
      toTarget:'將以下繁體中文翻譯成泰語，只輸出翻譯結果，不加任何說明。',
      toZh:'將以下泰語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。'},
  id:{label:'印尼語',srCode:'id-ID',ttsLang:'id-ID',
      toTarget:'將以下繁體中文翻譯成印尼語（Bahasa Indonesia），只輸出翻譯結果，不加任何說明。',
      toZh:'將以下印尼語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。'},
  en:{label:'英語',srCode:'en-US',ttsLang:'en-US',
      toTarget:'將以下繁體中文翻譯成英語，只輸出翻譯結果，不加任何說明。',
      toZh:'將以下英語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。'}
};

var SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
var hasSR = !!SRClass;
var currentLang = 'vi';
var isLive = false;
var isMuted = false;
var rec = null;
var ttsQueue = [];
var ttsBusy = false;
var srMode = 'zh';
var currentSpeaker = 'a';
var liveEl = null;
var liveElSide = 'a';
var subTimer = null;
var pillTimer = null;
var voiceLoadTimer = null;

// 語速：預設各語言
var ttsRates = {
  'zh-TW': 1.0,
  'vi-VN': 1.0,
  'th-TH': 1.0,
  'id-ID': 1.0,
  'en-US': 1.0
};
// 滑桿控制「目前說話者」的語言語速
var currentTTSLang = 'vi-VN'; // 預設跟著外語

if (!hasSR) showWarn('語音辨識需要 Chrome 或 Edge，且須在 HTTPS 環境下執行');

(function preloadVoices(){
  if (speechSynthesis.getVoices().length) return;
  speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged = null; };
})();

// ── 語速滑桿 ─────────────────────────────
function onRateChange(val) {
  val = parseFloat(val);
  ttsRates[currentTTSLang] = val;
  document.getElementById('rateDisplay').textContent = val.toFixed(2).replace(/\.?0+$/,'') + '×';
}

function updateRateSlider(ttsLang) {
  currentTTSLang = ttsLang;
  var rate = ttsRates[ttsLang] || 1.0;
  document.getElementById('rateSlider').value = rate;
  document.getElementById('rateDisplay').textContent = rate.toFixed(2).replace(/\.?0+$/,'') + '×';
  // 標籤顯示正在調哪個語言
  var langNames = {'zh-TW':'中文','vi-VN':'越南語','th-TH':'泰語','id-ID':'印尼語','en-US':'英語'};
  document.getElementById('rateLabel').textContent = '🔊 朗讀語速（' + (langNames[ttsLang]||ttsLang) + '）';
}

// ── 語言切換 ──────────────────────────────
function setLang(el) {
  if (isLive) return;
  document.querySelectorAll('.lang-tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  currentLang = el.dataset.lang;
  var label = LANGS[currentLang].label;
  document.getElementById('pillB').textContent = '說話者 B ' + label;
  document.getElementById('swBtnBLabel').textContent = '🌐 B 說' + label;
  updateRateSlider(LANGS[currentLang].ttsLang);
}

// ── 說話者切換 ────────────────────────────
function setSpeaker(side) {
  if (!isLive || ttsBusy) return;
  currentSpeaker = side;
  srMode = (side === 'a') ? 'zh' : 'target';
  // 滑桿跟著切換到對應語言
  var ttsLang = (side === 'a') ? 'zh-TW' : LANGS[currentLang].ttsLang;
  updateRateSlider(ttsLang);
  updateSwitchUI();
  killRec();
  setTimeout(beginRec, 60);
}

function updateSwitchUI() {
  var btnA = document.getElementById('swBtnA');
  var btnB = document.getElementById('swBtnB');
  if (currentSpeaker === 'a') {
    btnA.classList.add('active-a'); btnB.classList.remove('active-b');
    document.getElementById('statusLabel').textContent = '🎙 A 說話中（中文）';
    document.getElementById('statusLabel').style.color = 'var(--a-color)';
  } else {
    btnB.classList.add('active-b'); btnA.classList.remove('active-a');
    document.getElementById('statusLabel').textContent = '🎙 B 說話中（' + LANGS[currentLang].label + '）';
    document.getElementById('statusLabel').style.color = 'var(--b-color)';
  }
}

// ── 靜音 ─────────────────────────────────
function toggleMute() {
  isMuted = !isMuted;
  var btn = document.getElementById('muteBtn');
  btn.textContent = isMuted ? '🔇 翻譯已靜音' : '🔊 翻譯朗讀';
  btn.classList.toggle('muted', isMuted);
  if (isMuted) { stopAudio(); ttsQueue = []; ttsBusy = false; }
}

// ── 開始 / 停止 ───────────────────────────
function toggleSession() {
  if (!hasSR) return;
  isLive ? stopSession() : startSession();
}

function startSession() {
  isLive = true;
  currentSpeaker = 'a';
  srMode = 'zh';
  ttsBusy = false;
  try { var w=new SpeechSynthesisUtterance(''); w.volume=0; speechSynthesis.speak(w); speechSynthesis.cancel(); } catch(e){}
  document.getElementById('bigBtn').classList.add('live');
  document.getElementById('iconMic').style.display = 'none';
  document.getElementById('iconStop').style.display = '';
  document.getElementById('switchRow').style.display = 'flex';
  var label = LANGS[currentLang].label;
  document.getElementById('swBtnBLabel').textContent = '🌐 B 說' + label;
  document.getElementById('pillB').textContent = '說話者 B ' + label;
  var hint = document.getElementById('chat').querySelector('.chat-hint');
  if (hint) hint.remove();
  // 開始時滑桿對應 A（中文）
  updateRateSlider('zh-TW');
  updateSwitchUI();
  beginRec();
}

function stopSession() {
  isLive = false; ttsBusy = false;
  killRec();
  document.getElementById('bigBtn').classList.remove('live');
  document.getElementById('iconMic').style.display = '';
  document.getElementById('iconStop').style.display = 'none';
  document.getElementById('statusLabel').textContent = '按下開始對話';
  document.getElementById('statusLabel').style.color = '';
  document.getElementById('switchRow').style.display = 'none';
  document.getElementById('swBtnA').classList.remove('active-a');
  document.getElementById('swBtnB').classList.remove('active-b');
  removeLiveEl(); hidePills(); fadeSubtitle(); stopAudio(); ttsQueue = [];
  if (voiceLoadTimer) { clearTimeout(voiceLoadTimer); voiceLoadTimer = null; }
  try { speechSynthesis.cancel(); } catch(e) {}
}

// ── 語音辨識 ──────────────────────────────
function killRec() {
  if (!rec) return;
  var r = rec; rec = null;
  r.onresult = null; r.onerror = null; r.onend = null;
  try { r.abort(); } catch(e) {}
}

function beginRec() {
  if (!isLive || ttsBusy) return;
  killRec();
  var langCode = (srMode === 'zh') ? 'zh-TW' : LANGS[currentLang].srCode;
  var r = new SRClass();
  rec = r;
  r.lang = langCode;
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onresult = function(e) {
    if (!isLive) return;
    var interim = '', fin = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t; else interim += t;
    }
    var text = (fin || interim).trim();
    if (!text) return;
    if (!fin) { updateLiveEl(currentSpeaker, text); setSubOrig(text); return; }
    var side = currentSpeaker;
    var isZh = (side === 'a');
    var prompt = isZh ? LANGS[currentLang].toTarget : LANGS[currentLang].toZh;
    var ttsLang = isZh ? LANGS[currentLang].ttsLang : 'zh-TW';
    removeLiveEl(); showPill(side); setSubOrig(fin);
    commitMsg(side, fin, prompt, ttsLang);
  };

  r.onerror = function(e) {
    if (e.error === 'not-allowed') { showWarn('麥克風權限被拒絕'); stopSession(); return; }
    console.warn('SR error:', e.error);
  };

  r.onend = function() {
    if (rec !== r) return;
    rec = null;
    if (!isLive || ttsBusy) return;
    setTimeout(beginRec, 80);
  };

  try { r.start(); } catch(e) { rec = null; if (isLive) setTimeout(beginRec, 500); }
}

// ── 訊息 & 翻譯 ───────────────────────────
function commitMsg(side, text, prompt, ttsLang) {
  var who = (side==='a') ? '說話者 A（中文）' : ('說話者 B（'+LANGS[currentLang].label+'）');
  var el = document.createElement('div');
  el.className = 'msg ' + side;
  el.innerHTML = '<div class="msg-who">'+who+'</div><div class="msg-bubble"><div class="msg-orig">'+esc(text)+'</div><div class="msg-div"></div><div class="msg-tling"><div class="dots"><span></span><span></span><span></span></div><span>翻譯中</span></div></div>';
  document.getElementById('chat').appendChild(el);
  scrollChat();
  setSubTl('…', side);
  doTranslate(text, prompt).then(function(result) {
    var tling = el.querySelector('.msg-tling');
    if (!tling) return;
    var d = document.createElement('div');
    d.className = 'msg-tl'; d.textContent = result;
    tling.replaceWith(d);
    setSubTl(result, side); scrollChat();
    if (!isMuted) enqueueTTS(result, ttsLang, d);
    else { if (isLive && !ttsBusy) beginRec(); }
  }).catch(function() { if (isLive && !ttsBusy) beginRec(); });
}

function doTranslate(text, prompt) {
  return fetch('/translate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({messages:[
      {role:'system', content:'你是專業翻譯員，只輸出翻譯結果，不加任何說明或解釋。'},
      {role:'user', content:prompt+'\n\n'+text}
    ]})
  }).then(function(res) {
    return res.text().then(function(raw) {
      if (!raw||!raw.trim()) throw new Error('HTTP '+res.status+' 空回應');
      var data = JSON.parse(raw);
      if (!res.ok) throw new Error(data.error||'HTTP '+res.status);
      var result = data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
      if (!result||!result.trim()) throw new Error('回傳格式錯誤');
      return result.trim();
    });
  }).catch(function(err) { console.error('translate error:',err); return '（錯誤：'+err.message+'）'; });
}

// ── TTS ───────────────────────────────────
function stopAudio() { try { speechSynthesis.cancel(); } catch(e) {} }

function enqueueTTS(text, lang, labelEl) {
  ttsQueue.push({text:text, lang:lang, labelEl:labelEl});
  if (!ttsBusy) drainTTS();
}

function pickVoice(lang) {
  var voices = speechSynthesis.getVoices();
  if (!voices||!voices.length) return null;
  var exact=[], prefix=[], preferred=['Google','Premium','Natural','Enhanced','Microsoft','WaveNet'];
  var pc = lang.split('-')[0];
  for (var i=0;i<voices.length;i++) {
    var v=voices[i]; if (!v.lang) continue;
    if (v.lang===lang) exact.push(v);
    else if (v.lang.indexOf(pc)===0) prefix.push(v);
  }
  function score(v) {
    var s=0, name=(v.name||'').toLowerCase(), fl=(v.lang||'').toLowerCase();
    if (fl===lang.toLowerCase()) s+=100;
    if (fl.indexOf(pc.toLowerCase())===0) s+=30;
    if (v.localService===false) s+=10;
    if (v.default) s+=8;
    for (var j=0;j<preferred.length;j++) if (name.indexOf(preferred[j].toLowerCase())!==-1) s+=20;
    if (name.indexOf('online')!==-1) s+=5;
    if (name.indexOf('enhanced')!==-1) s+=5;
    return s;
  }
  function best(list) { if (!list.length) return null; list.sort(function(a,b){return score(b)-score(a);}); return list[0]; }
  return best(exact)||best(prefix)||null;
}

function speakWithBrowserTTS(text, lang, done) {
  var finished = false;
  function finish() {
    if (finished) return; finished=true;
    if (voiceLoadTimer) { clearTimeout(voiceLoadTimer); voiceLoadTimer=null; }
    speechSynthesis.onvoiceschanged = null;
    done();
  }
  function speakNow() {
    try { speechSynthesis.cancel(); } catch(e) {}
    try { speechSynthesis.resume(); } catch(e) {}
    var utt = new SpeechSynthesisUtterance(text);
    // 使用使用者調整的語速
    var rate = ttsRates[lang] || 1.0;
    utt.lang = lang;
    utt.rate = rate;
    utt.pitch = 1.0;
    utt.volume = 1.0;
    var voice = pickVoice(lang);
    if (voice) utt.voice = voice;
    utt.onstart = function() { if (voiceLoadTimer) { clearTimeout(voiceLoadTimer); voiceLoadTimer=null; } };
    utt.onend = function() { setTimeout(finish,150); };
    utt.onerror = function(e) { console.warn('TTS error:',e.error); setTimeout(finish,150); };
    try { speechSynthesis.speak(utt); } catch(e) { setTimeout(finish,100); return; }
    var ms = Math.max(6000, Math.min(90000, text.length * 300));
    voiceLoadTimer = setTimeout(function() { try{speechSynthesis.cancel();}catch(e){} finish(); }, ms);
  }
  var voices = speechSynthesis.getVoices();
  if (voices&&voices.length>0) { speakNow(); return; }
  var waited=false;
  speechSynthesis.onvoiceschanged = function() {
    if (waited) return; waited=true;
    if (voiceLoadTimer) { clearTimeout(voiceLoadTimer); voiceLoadTimer=null; }
    speakNow();
  };
  voiceLoadTimer = setTimeout(function() {
    if (waited) return; waited=true;
    speechSynthesis.onvoiceschanged=null;
    speakNow();
  }, 1500);
}

function afterTTS() {
  ttsBusy=false;
  if (!isLive) return;
  beginRec();
}

function drainTTS() {
  if (!ttsQueue.length) { afterTTS(); return; }
  ttsBusy=true; killRec();
  var item=ttsQueue.shift();
  if (item.labelEl) item.labelEl.classList.add('speaking');
  speakWithBrowserTTS(item.text, item.lang, function() {
    if (item.labelEl) item.labelEl.classList.remove('speaking');
    setTimeout(function() { ttsQueue.length>0 ? drainTTS() : afterTTS(); }, 100);
  });
}

// ── UI 工具 ───────────────────────────────
function updateLiveEl(side, text) {
  if (!liveEl||liveElSide!==side) {
    removeLiveEl();
    liveEl=document.createElement('div');
    liveEl.className='live-bubble '+side;
    liveEl.innerHTML='<div class="micwave"><span></span><span></span><span></span></div><span class="live-text"></span>';
    document.getElementById('chat').appendChild(liveEl);
    liveElSide=side;
  }
  liveEl.querySelector('.live-text').textContent=text;
  scrollChat();
}
function removeLiveEl() { if (liveEl) { liveEl.remove(); liveEl=null; } }
function setSubOrig(text) { clearTimeout(subTimer); document.getElementById('subOrig').textContent=text; }
function setSubTl(text,side) {
  var el=document.getElementById('subTl');
  el.textContent=text;
  el.style.color=side==='a'?'rgba(77,182,255,.9)':side==='b'?'rgba(255,112,67,.9)':'rgba(255,255,255,.5)';
}
function fadeSubtitle() {
  subTimer=setTimeout(function(){
    document.getElementById('subOrig').innerHTML='<span class="sub-dim">字幕顯示於此</span>';
    document.getElementById('subTl').textContent='';
  },5000);
}
function showPill(side) {
  clearTimeout(pillTimer);
  document.getElementById('pillA').classList.remove('show');
  document.getElementById('pillB').classList.remove('show');
  document.getElementById('pill'+side.toUpperCase()).classList.add('show');
  pillTimer=setTimeout(hidePills,3000);
}
function hidePills() {
  document.getElementById('pillA').classList.remove('show');
  document.getElementById('pillB').classList.remove('show');
}
function scrollChat() { var c=document.getElementById('chat'); c.scrollTop=c.scrollHeight; }
function clearChat() {
  document.getElementById('chat').innerHTML='<div class="chat-hint">按下開始按鈕<br>選擇說話者後開始說話<br>說完後再切換說話者</div>';
  document.getElementById('subOrig').innerHTML='<span class="sub-dim">字幕顯示於此</span>';
  document.getElementById('subTl').textContent='';
  stopAudio(); ttsQueue=[]; ttsBusy=false;
  if (voiceLoadTimer) { clearTimeout(voiceLoadTimer); voiceLoadTimer=null; }
}
function showWarn(msg) { var e=document.getElementById('warnBar'); e.textContent=msg; e.style.display='block'; }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
