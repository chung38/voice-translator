<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>即時對話翻譯</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap');

:root {
  --bg: #0d0d0d;
  --surface: #181818;
  --card: #222;
  --border: #2e2e2e;
  --a-color: #4db6ff;
  --a-bg: rgba(77,182,255,0.12);
  --b-color: #ff7043;
  --b-bg: rgba(255,112,67,0.12);
  --text: #efefef;
  --text-dim: #555;
  --text-mid: #888;
  --r: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Noto Sans TC','Noto Sans',sans-serif; overflow: hidden; }

.app { display:flex; flex-direction:column; height:100vh; height:100dvh;
  max-width:600px; margin:0 auto; }

/* ── TOP BAR ── */
.top-bar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
}

.lang-tabs {
  display: flex;
  gap: 6px;
  flex: 1;
  flex-wrap: wrap;
}

.lang-tab {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-mid);
  transition: all 0.2s;
  white-space: nowrap;
}
.lang-tab.active {
  border-color: var(--a-color);
  color: var(--a-color);
  background: var(--a-bg);
}

/* ── CHAT AREA ── */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chat-hint {
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  padding: 40px 20px;
  line-height: 2;
}

/* ── MESSAGE ── */
.msg {
  display: flex;
  flex-direction: column;
  max-width: 88%;
  animation: pop-in 0.18s ease;
}
@keyframes pop-in {
  from { opacity:0; transform:translateY(6px) scale(0.97); }
  to   { opacity:1; transform:none; }
}

.msg.a { align-self: flex-start; }
.msg.b { align-self: flex-end; align-items: flex-end; }

.msg-who {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  margin-bottom: 3px;
  padding: 0 4px;
}
.msg.a .msg-who { color: var(--a-color); }
.msg.b .msg-who { color: var(--b-color); }

.msg-bubble {
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.msg.a .msg-bubble { background: rgba(77,182,255,0.13); border-top-left-radius: 4px; }
.msg.b .msg-bubble { background: rgba(255,112,67,0.13); border-top-right-radius: 4px; text-align: right; }

.msg-orig  { font-size: 15px; line-height: 1.55; color: #fff; font-weight: 500; }
.msg-div   { height: 1px; background: rgba(255,255,255,0.08); margin: 1px 0; }
.msg-tl    { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.55); font-style: italic; }

.msg-tling {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  gap: 5px;
}
.msg.b .msg-tling { flex-direction: row-reverse; }

.dots { display:inline-flex; gap:3px; }
.dots span {
  width:4px; height:4px; border-radius:50%;
  background: rgba(255,255,255,0.3);
  animation: db 1s infinite;
  display:inline-block;
}
.dots span:nth-child(2){ animation-delay:.15s; }
.dots span:nth-child(3){ animation-delay:.3s; }
@keyframes db {
  0%,80%,100%{ opacity:.3; transform:scale(.8); }
  40%{ opacity:1; transform:scale(1); }
}

/* ── LIVE PREVIEW BUBBLE ── */
.live-bubble {
  max-width: 88%;
  padding: 8px 14px;
  border-radius: 14px;
  border: 1px dashed var(--border);
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: pop-in 0.15s ease;
}
.live-bubble.b { align-self: flex-end; flex-direction: row-reverse; text-align: right; }

.micwave { display:flex; gap:2px; align-items:center; flex-shrink:0; }
.micwave span { width:2px; border-radius:1px; animation:mw .65s ease-in-out infinite; }
.live-bubble.a .micwave span { background: var(--a-color); }
.live-bubble.b .micwave span { background: var(--b-color); }
.micwave span:nth-child(1){ height:5px; animation-delay:0s; }
.micwave span:nth-child(2){ height:12px; animation-delay:.1s; }
.micwave span:nth-child(3){ height:7px; animation-delay:.2s; }
@keyframes mw {
  0%,100%{ transform:scaleY(.4); }
  50%{ transform:scaleY(1); }
}

/* ── SUBTITLE BAR ── */
.sub-bar {
  background: #000;
  border-top: 1px solid var(--border);
  padding: 10px 18px;
  min-height: 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-align: center;
  flex-shrink: 0;
}
.sub-orig { font-size: 16px; font-weight: 500; color: #fff; line-height: 1.45; min-height: 1.45em; }
.sub-tl   { font-size: 14px; line-height: 1.45; min-height: 1.45em; transition: color .3s; }
.sub-dim  { color: var(--text-dim); font-size: 13px; font-style: italic; font-weight: 400; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 18px 20px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* ── STATUS LABEL ── */
.status-label {
  font-size: 13px;
  color: var(--text-mid);
  letter-spacing: .03em;
  height: 18px;
  transition: color .3s;
}

/* ── BIG BUTTON ── */
.big-btn {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1c2a1c;
  border: 2px solid #3a3;
  transition: all .2s;
  outline: none;
  position: relative;
}
.big-btn:active { transform: scale(.95); }

.big-btn.live {
  background: rgba(255,80,80,0.12);
  border-color: #f55;
  animation: pulse-live 1.8s ease-in-out infinite;
}
@keyframes pulse-live {
  0%,100%{ box-shadow: 0 0 0 0 rgba(255,80,80,.4); }
  50%{ box-shadow: 0 0 0 14px rgba(255,80,80,0); }
}

.big-btn svg { width: 32px; height: 32px; }

/* ── BOTTOM ROW ── */
.bottom-actions {
  display: flex;
  gap: 16px;
}

.small-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 16px;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .2s;
}
.small-btn:hover { border-color: #555; color: var(--text-mid); }

/* ── WARN ── */
.warn-bar {
  background: rgba(255,80,80,.1);
  border: 1px solid rgba(255,80,80,.25);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  color: #ff9090;
  text-align: center;
  display: none;
  margin: 0 12px;
  flex-shrink: 0;
}

/* ── SPEAKER INDICATOR ── */
.speaker-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  height: 20px;
}
.pill {
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .04em;
  opacity: 0;
  transition: opacity .3s;
}
.pill.a { background: var(--a-bg); color: var(--a-color); border: 1px solid var(--a-color); }
.pill.b { background: var(--b-bg); color: var(--b-color); border: 1px solid var(--b-color); }
.pill.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- 頂部語言選擇 -->
  <div class="top-bar">
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="vi" onclick="setLang(this)">🇻🇳 越南語</button>
      <button class="lang-tab" data-lang="th" onclick="setLang(this)">🇹🇭 泰語</button>
      <button class="lang-tab" data-lang="id" onclick="setLang(this)">🇮🇩 印尼語</button>
      <button class="lang-tab" data-lang="en" onclick="setLang(this)">🇬🇧 英語</button>
    </div>
  </div>

  <!-- 對話記錄 -->
  <div class="chat" id="chat">
    <div class="chat-hint">
      按下開始按鈕<br>
      說中文 → 自動翻譯成目標語言<br>
      說目標語言 → 自動翻譯成中文
    </div>
  </div>

  <!-- 警告列 -->
  <div class="warn-bar" id="warnBar"></div>

  <!-- 即時字幕 -->
  <div class="sub-bar">
    <div class="sub-orig" id="subOrig"><span class="sub-dim">字幕顯示於此</span></div>
    <div class="sub-tl"   id="subTl"></div>
  </div>

  <!-- 底部控制 -->
  <div class="bottom-bar">

    <div class="speaker-pill">
      <div class="pill a" id="pillA">說話者 A 中文</div>
      <div class="pill b" id="pillB">說話者 B</div>
    </div>

    <div class="status-label" id="statusLabel">按下開始對話</div>

    <button class="big-btn" id="bigBtn" onclick="toggleSession()">
      <svg id="iconMic" viewBox="0 0 32 32" fill="none">
        <rect x="11" y="3" width="10" height="16" rx="5" fill="#4a4"/>
        <path d="M6 16c0 5.523 4.477 10 10 10s10-4.477 10-10" stroke="#4a4" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="16" y1="26" x2="16" y2="30" stroke="#4a4" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <svg id="iconStop" viewBox="0 0 32 32" fill="none" style="display:none">
        <rect x="9" y="9" width="14" height="14" rx="3" fill="#f55"/>
      </svg>
    </button>

    <div class="bottom-actions">
      <button class="small-btn" onclick="clearChat()">清除記錄</button>
    </div>

  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const LANGS = {
  vi: { label:'越南語', flag:'🇻🇳', code:'vi-VN',
        toTarget:'將以下繁體中文翻譯成越南語，只輸出翻譯結果，不加任何說明。',
        toZh:    '將以下越南語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。' },
  th: { label:'泰語', flag:'🇹🇭', code:'th-TH',
        toTarget:'將以下繁體中文翻譯成泰語，只輸出翻譯結果，不加任何說明。',
        toZh:    '將以下泰語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。' },
  id: { label:'印尼語', flag:'🇮🇩', code:'id-ID',
        toTarget:'將以下繁體中文翻譯成印尼語（Bahasa Indonesia），只輸出翻譯結果，不加任何說明。',
        toZh:    '將以下印尼語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。' },
  en: { label:'英語', flag:'🇬🇧', code:'en-US',
        toTarget:'將以下繁體中文翻譯成英語，只輸出翻譯結果，不加任何說明。',
        toZh:    '將以下英語翻譯成繁體中文，只輸出翻譯結果，不加任何說明。' },
};

// ── 語言偵測：用 Unicode block 判斷 ──────────────────────────────────────────
function detectLang(text) {
  let zh = 0, latin = 0, thai = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    if (cp >= 0x4E00 && cp <= 0x9FFF) zh++;
    if (cp >= 0x0E00 && cp <= 0x0E7F) thai++;
    if ((cp >= 0x0041 && cp <= 0x007A) || (cp >= 0x00C0 && cp <= 0x024F)) latin++;
  }
  const total = zh + latin + thai + 1;
  const cur = currentLang;
  if (zh / total > 0.35) return 'zh';
  if (thai / total > 0.2 && cur === 'th') return 'target';
  if (latin / total > 0.3 && (cur === 'vi' || cur === 'en' || cur === 'id')) return 'target';
  return 'zh';
}

// ─── State ────────────────────────────────────────────────────────────────────
let currentLang = 'vi';
let isLive = false;
let rec = null;        // 單一 SpeechRecognition 實例
let liveElA = null;
let liveElB = null;
let subTimer = null;

const hasSR = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
if (!hasSR) showWarn('⚠ 語音辨識需要 Chrome 或 Edge，且須在 HTTPS 環境下執行');

// ─── Language ─────────────────────────────────────────────────────────────────
function setLang(el) {
  if (isLive) return;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentLang = el.dataset.lang;
  const cfg = LANGS[currentLang];
  document.getElementById('pillB').textContent = `說話者 B ${cfg.label}`;
  // 重啟辨識以套用新語言
  if (isLive) {
    stopRecognition();
    startRecognition();
  }
}

// ─── Session toggle ───────────────────────────────────────────────────────────
function toggleSession() {
  if (!hasSR) return;
  isLive ? stopSession() : startSession();
}

function startSession() {
  isLive = true;
  const btn = document.getElementById('bigBtn');
  btn.classList.add('live');
  document.getElementById('iconMic').style.display = 'none';
  document.getElementById('iconStop').style.display = '';
  document.getElementById('statusLabel').textContent = '對話進行中…';
  document.getElementById('statusLabel').style.color = '#f55';

  const hint = document.getElementById('chat').querySelector('.chat-hint');
  if (hint) hint.remove();

  startRecognition();
}

function stopSession() {
  isLive = false;
  const btn = document.getElementById('bigBtn');
  btn.classList.remove('live');
  document.getElementById('iconMic').style.display = '';
  document.getElementById('iconStop').style.display = 'none';
  document.getElementById('statusLabel').textContent = '按下開始對話';
  document.getElementById('statusLabel').style.color = '';

  stopRecognition();
  removeLive('a');
  removeLive('b');
  hidePills();
  fadeSubtitle();
}

function stopRecognition() {
  if (!rec) return;
  const r = rec;
  rec = null;
  try { r.stop(); } catch(e) {}
}

// ─── 單一 Recognition，用 detectLang 判斷語言方向 ────────────────────────────
// 策略：先用中文模型辨識。若偵測到是目標語言，立刻重啟成目標語言模型繼續。
// 兩個模型交替使用，確保辨識率最佳，且同一時間只有一個在運行。

let recLang = 'zh'; // 目前辨識語言：'zh' 或 'target'

function startRecognition() {
  if (!isLive) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR();
  rec = r;

  // 交替語言：上次是中文就改成目標語言，反之亦然
  // 但實際上我們依靠 detectLang 結果來判斷翻譯方向
  // 辨識語言則每次交替，讓兩種語言都能被正確辨識
  r.lang = recLang === 'zh' ? 'zh-TW' : LANGS[currentLang].code;
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (final += t) : (interim += t);
    }
    const text = final || interim;
    if (!text.trim()) return;

    // 用 detectLang 判斷語言方向（比辨識模型更準確）
    const detected = detectLang(text);
    const side = detected === 'zh' ? 'a' : 'b';

    showLive(side, text);
    setSubOrig(text);

    if (final.trim()) {
      removeLive(side);
      showPill(side);
      const prompt = detected === 'zh'
        ? LANGS[currentLang].toTarget
        : LANGS[currentLang].toZh;
      commitMsg(side, final.trim(), prompt);
    }
  };

  r.onerror = e => {
    if (e.error === 'not-allowed') {
      showWarn('⚠ 麥克風權限被拒絕');
      stopSession();
    }
    // no-speech / audio-capture 等錯誤不處理，onend 會自動重啟
  };

  r.onend = () => {
    if (!isLive) return;
    // 切換辨識語言，讓下一輪辨識另一種語言
    recLang = recLang === 'zh' ? 'target' : 'zh';
    setTimeout(startRecognition, 80);
  };

  try { r.start(); } catch(e) {}
}

// ─── Live preview bubble ──────────────────────────────────────────────────────
function showLive(side, text) {
  let el = side === 'a' ? liveElA : liveElB;
  if (!el) {
    el = document.createElement('div');
    el.className = `live-bubble ${side}`;
    el.innerHTML = `<div class="micwave"><span></span><span></span><span></span></div><span class="live-text"></span>`;
    document.getElementById('chat').appendChild(el);
    if (side === 'a') liveElA = el; else liveElB = el;
    scrollChat();
  }
  el.querySelector('.live-text').textContent = text;
  scrollChat();
}
function removeLive(side) {
  if (side === 'a' && liveElA) { liveElA.remove(); liveElA = null; }
  if (side === 'b' && liveElB) { liveElB.remove(); liveElB = null; }
}

// ─── Commit final message ─────────────────────────────────────────────────────
function commitMsg(side, text, prompt) {
  const chat = document.getElementById('chat');
  const cfg = LANGS[currentLang];
  const who = side === 'a'
    ? '說話者 A（中文）'
    : `說話者 B（${cfg.label}）`;

  const el = document.createElement('div');
  el.className = `msg ${side}`;
  el.innerHTML = `
    <div class="msg-who">${who}</div>
    <div class="msg-bubble">
      <div class="msg-orig">${esc(text)}</div>
      <div class="msg-div"></div>
      <div class="msg-tling">
        <div class="dots"><span></span><span></span><span></span></div>
        <span>翻譯中</span>
      </div>
    </div>`;
  chat.appendChild(el);
  scrollChat();

  setSubOrig(text);
  setSubTl('…', side);

  doTranslate(text, prompt).then(result => {
    const tl = el.querySelector('.msg-tling');
    if (tl) {
      const d = document.createElement('div');
      d.className = 'msg-tl';
      d.textContent = result;
      tl.replaceWith(d);
    }
    setSubTl(result, side);
    scrollChat();
  });
}

// ─── API call ─────────────────────────────────────────────────────────────────
async function doTranslate(text, prompt) {
  try {
    const res = await fetch('/.netlify/functions/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: '你是專業翻譯員，只輸出翻譯結果，不加任何說明或解釋。' },
          { role: 'user', content: `${prompt}\n\n${text}` }
        ]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '翻譯失敗');
    return data.choices?.[0]?.message?.content?.trim() || '（翻譯失敗）';
  } catch(err) {
    return `（錯誤：${err.message}）`;
  }
}

// ─── Subtitle ─────────────────────────────────────────────────────────────────
function setSubOrig(text) {
  clearTimeout(subTimer);
  const el = document.getElementById('subOrig');
  el.textContent = text;
  el.style.color = '#fff';
}
function setSubTl(text, side) {
  const el = document.getElementById('subTl');
  el.textContent = text;
  el.style.color = side === 'a' ? 'rgba(77,182,255,.9)'
                 : side === 'b' ? 'rgba(255,112,67,.9)'
                 : 'rgba(255,255,255,.5)';
}
function fadeSubtitle() {
  subTimer = setTimeout(() => {
    document.getElementById('subOrig').innerHTML = '<span class="sub-dim">字幕顯示於此</span>';
    document.getElementById('subTl').textContent = '';
  }, 5000);
}

// ─── Pill indicators ──────────────────────────────────────────────────────────
let pillTimer = null;
function showPill(side) {
  clearTimeout(pillTimer);
  document.getElementById('pillA').classList.remove('show');
  document.getElementById('pillB').classList.remove('show');
  document.getElementById('pill' + side.toUpperCase()).classList.add('show');
  pillTimer = setTimeout(hidePills, 3000);
}
function hidePills() {
  document.getElementById('pillA').classList.remove('show');
  document.getElementById('pillB').classList.remove('show');
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function scrollChat() { const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight; }

function clearChat() {
  document.getElementById('chat').innerHTML =
    '<div class="chat-hint">按下開始按鈕<br>說中文 → 自動翻譯成目標語言<br>說目標語言 → 自動翻譯成中文</div>';
  document.getElementById('subOrig').innerHTML = '<span class="sub-dim">字幕顯示於此</span>';
  document.getElementById('subTl').textContent = '';
}

function showWarn(msg) { const e = document.getElementById('warnBar'); e.textContent = msg; e.style.display = 'block'; }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
